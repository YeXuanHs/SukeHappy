name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    name: php-${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Build extension
        run: |
          set -eux
          php -v
          phpize
          ./configure --with-php-config="$(which php-config)"
          make -j"$(nproc)"
          ls -l modules/mdyguard.so

      - name: Smoke test (blocklist works)
        run: |
          set -eux
          php -d extension="$PWD/modules/mdyguard.so" -r '
            function greatMove(){ echo "SHOULD_NOT_PRINT\n"; }
            greatMove();
            echo "AFTER\n";
          ' > out.txt 2>&1 || true
          cat out.txt
          if grep -q SHOULD_NOT_PRINT out.txt; then
            echo "::error::blocked function still executed"
            exit 1
          fi
          if grep -q AFTER out.txt; then
            echo "::error::request was not aborted"
            exit 1
          fi
          echo "blocked OK"

      - name: Smoke test (SQL guard)
        run: |
          set -eux
          EXT="$PWD/modules/mdyguard.so"
          # CREATE/INSERT/SELECT 必须放行
          php -d extension="$EXT" -r '
            $p = new PDO("sqlite::memory:");
            $p->exec("CREATE TABLE t(a int)");
            $p->exec("INSERT INTO t VALUES(1)");
            echo "SQL_OK " . count($p->query("SELECT a FROM t")->fetchAll()) . "\n";
          ' | tee sql1.txt
          grep -q "SQL_OK 1" sql1.txt
          # DROP 必须被拦
          php -d extension="$EXT" -d mdyguard.block_sql=1 -r '
            $p = new PDO("sqlite::memory:");
            $p->exec("CREATE TABLE t(a int)");
            $p->exec("DROP TABLE t");
            echo "DROP_PASSED\n";
          ' > sql2.txt 2>&1 || true
          if grep -q DROP_PASSED sql2.txt; then
            echo "::error::DROP was not blocked"
            exit 1
          fi
          # INTO OUTFILE 必须被拦
          php -d extension="$EXT" -d mdyguard.block_sql=1 -r '
            $p = new PDO("sqlite::memory:");
            $p->exec("SELECT 1 INTO OUTFILE \"x\"");
            echo "OUTFILE_PASSED\n";
          ' > sql3.txt 2>&1 || true
          if grep -q OUTFILE_PASSED sql3.txt; then
            echo "::error::OUTFILE was not blocked"
            exit 1
          fi
          # 默认配置（block_sql=0）下 DROP 必须放行 —— 证明不影响卸载/导入功能
          php -d extension="$EXT" -r '
            $p = new PDO("sqlite::memory:");
            $p->exec("CREATE TABLE t(a int)");
            $p->exec("DROP TABLE t");
            echo "DROP_ALLOWED_BY_DEFAULT\n";
          ' | tee sql4.txt
          grep -q DROP_ALLOWED_BY_DEFAULT sql4.txt
          echo "sql guard OK"

      - name: Version + ABI
        run: |
          php -i | grep -E 'PHP API|PHP Extension|Zend Extension|Thread Safety' || true
          php -d extension="$PWD/modules/mdyguard.so" -r 'print_r(get_loaded_extensions());' | grep -i mdyguard

      - name: Rename artifact
        run: |
          ABI=$(php -r 'echo PHP_ZTS ? "zts" : "nts";')
          VER=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')
          cp modules/mdyguard.so "mdyguard-${VER}-${ABI}-linux-x86_64.so"

      - uses: actions/upload-artifact@v4
        with:
          name: mdyguard-php${{ matrix.php }}
          path: mdyguard-*-linux-x86_64.so
          if-no-files-found: error
